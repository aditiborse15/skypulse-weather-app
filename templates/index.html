<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SkyPulse Weather</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0d1b2a; color: #e8f4fd; max-width: 600px; margin: 40px auto; padding: 20px; }
    h1 { color: #4fc3f7; }
    input { padding: 10px; width: 70%; border-radius: 8px; border: 1px solid #4fc3f7; background: #1a2a3a; color: #fff; font-size: 1rem; }
    button { padding: 10px 20px; background: #4fc3f7; color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    #result { margin-top: 24px; background: rgba(255,255,255,0.07); border-radius: 12px; padding: 20px; display: none; }
    .temp { font-size: 3rem; font-weight: bold; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
    .stat { background: rgba(255,255,255,0.06); padding: 12px 16px; border-radius: 10px; flex: 1; min-width: 100px; }
    .stat-label { font-size: 0.75rem; color: #aaa; }
    .stat-value { font-size: 1.1rem; font-weight: bold; margin-top: 4px; }
    .forecast { margin-top: 20px; }
    .f-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .f-day { background: rgba(255,255,255,0.06); padding: 10px; border-radius: 10px; text-align: center; flex: 1; }
    #error { color: #ff7675; margin-top: 12px; }
  </style>
</head>
<body>

<h1>🌤️ SkyPulse</h1>
<p style="color:#aaa">Enter a city to get live weather</p>

<div style="display:flex; gap:8px; margin-top:16px">
  <input type="text" id="city" placeholder="e.g. Mumbai, London, Tokyo…">
  <button onclick="getWeather()">Search</button>
</div>
<div id="error"></div>

<div id="result">
  <div id="city-name" style="font-size:1.4rem; font-weight:bold"></div>
  <div class="temp" id="temp"></div>
  <div id="desc" style="color:#aaa; margin-top:4px"></div>

  <div class="row">
    <div class="stat"><div class="stat-label">Feels Like</div><div class="stat-value" id="feels"></div></div>
    <div class="stat"><div class="stat-label">Humidity</div><div class="stat-value" id="humidity"></div></div>
    <div class="stat"><div class="stat-label">Wind</div><div class="stat-value" id="wind"></div></div>
    <div class="stat"><div class="stat-label">Visibility</div><div class="stat-value" id="vis"></div></div>
    <div class="stat"><div class="stat-label">Pressure</div><div class="stat-value" id="pressure"></div></div>
    <div class="stat"><div class="stat-label">Cloud Cover</div><div class="stat-value" id="clouds"></div></div>
  </div>

  <div class="forecast">
    <div style="color:#aaa; font-size:0.8rem; margin-top:16px">5-DAY FORECAST</div>
    <div class="f-row" id="forecast-row"></div>
  </div>
</div>

<script>
async function getWeather() {
  const city = document.getElementById('city').value.trim();
  const err  = document.getElementById('error');
  err.textContent = '';

  if (!city) { err.textContent = 'Please enter a city name.'; return; }

  try {
    const res  = await fetch(`/api/weather?city=${encodeURIComponent(city)}`);
    const data = await res.json();

    if (!res.ok) { err.textContent = '❌ ' + data.error; return; }

    document.getElementById('city-name').textContent = data.emoji + '  ' + data.city + ', ' + data.country;
    document.getElementById('temp').textContent      = data.temp + '°C';
    document.getElementById('desc').textContent      = data.description + '  ↑' + data.temp_max + '°  ↓' + data.temp_min + '°';
    document.getElementById('feels').textContent     = data.feels_like + '°C';
    document.getElementById('humidity').textContent  = data.humidity + '%';
    document.getElementById('wind').textContent      = data.wind_speed + ' m/s';
    document.getElementById('vis').textContent       = data.visibility + ' km';
    document.getElementById('pressure').textContent  = data.pressure + ' hPa';
    document.getElementById('clouds').textContent    = data.clouds + '%';

    const row = document.getElementById('forecast-row');
    row.innerHTML = data.forecast.map(f =>
      `<div class="f-day">
        <div style="font-size:0.75rem;color:#aaa">${f.date.slice(5)}</div>
        <div style="font-size:1.4rem">${f.emoji}</div>
        <div style="font-weight:bold">${Math.round(f.temp)}°</div>
        <div style="font-size:0.75rem;color:#aaa">${Math.round(f.min)}°–${Math.round(f.max)}°</div>
      </div>`
    ).join('');

    document.getElementById('result').style.display = 'block';
  } catch(e) {
    err.textContent = '❌ Network error. Is Flask running?';
  }
}

document.getElementById('city').addEventListener('keydown', e => {
  if (e.key === 'Enter') getWeather();
});
</script>
</body>
</html>
